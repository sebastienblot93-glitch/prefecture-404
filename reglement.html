<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Préfecture 404 — Règlement de l'inspecteur</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%274%27 y=%2716%27 width=%2756%27 height=%2732%27 rx=%274%27 fill=%27none%27 stroke=%27%23be2a31%27 stroke-width=%275%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27Arial%27 font-weight=%27900%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%23be2a31%27%3E404%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/bureau.css">
</head>
<body class="page-role">
  <main class="role">
    <header class="role-entete">
      <p class="ct-emetteur">Bureau national de vérification des territoires</p>
      <h1>Carnet de l'inspecteur</h1>
      <p>Vous seul connaissez le règlement du jour. Écoutez l'agent, rappelez les décrets, et criez « Attendez ! » avant qu'il ne tamponne.</p>
    </header>
    <div id="reglement" class="memo memo-plein"></div>
  </main>
  <script type="module">
    import { JOURNEES, contexteDe } from './src/campagne/journees.js';
    import { contexteInfini } from './src/campagne/infini.js';
    import { htmlReglement } from './src/ui/reglement.js';
    const q = new URLSearchParams(location.search);
    const graine = q.get('graine');
    const jour = JOURNEES.find((j) => j.id === Number(q.get('jour'))) ?? JOURNEES[0];
    const ctx = graine ? contexteInfini(graine.toUpperCase()) : contexteDe(jour);
    document.getElementById('reglement').innerHTML =
      `<p class="regl-partie">${graine ? `Mode infini, graine ${graine.toUpperCase()}` : jour.titre}</p>` + htmlReglement(ctx);
  </script>
</body>
</html>
